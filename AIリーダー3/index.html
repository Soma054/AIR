<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>グループワークAI 試作版</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>

<body>
  <main id="login">
    <div class="thm" id="thmL"></div>
    <h1>グループワークAI</h1>
    <p style="color:var(--mu)">試作版 v3（データはこのブラウザ内のみ）</p>
    <div class="card lg">
      <div class="col lgL">
        <h2>生徒として入室</h2>
        <div><label for="code">ルームコード（6桁）</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="off">
        </div>
        <div><label for="nick">ニックネーム</label><input id="nick" autocomplete="off" oninput="lavRender()"
            onkeydown="if(event.key==='Enter'&&!event.isComposing&&event.keyCode!==229)join('student')"></div>
        <button class="btn" onclick="join('student')"><i data-lucide="log-in"></i>入室する</button>
        <hr style="border:0;border-top:1px solid var(--dv);width:100%;margin:4px 0">
        <h2>先生として開始</h2>
        <div><label for="pname">プロジェクト名</label><input id="pname" placeholder="例: 地域の防災マップ"></div>
        <button class="btn sec" onclick="join('teacher')"><i data-lucide="plus"></i>ルームを作成する</button>
        <p id="lerr" role="alert" style="color:var(--err);font-weight:700;min-height:1.7em"></p>
      </div>
      <div class="col lgR">
        <h2>アイコン（任意）</h2>
        <p style="color:var(--mu);margin:0">選んだアイコンは、入室するときに反映されます。入室後も、右上の名前のボタンから変更できます。</p>
        <div class="col" id="lav"></div><span id="lavpv" hidden></span>
      </div>
    </div>
  </main>

  <div id="app">
    <header>
      <h1 id="hName"></h1><span class="pill" id="hCode"></span><span class="pill"><i data-lucide="sparkles"></i>AI残り
        <span id="hAi"></span><span class="meter"><i id="hBar"></i></span></span>
      <button class="btn sec sm" onclick="openCatchup()"><i data-lucide="history"></i>追いつく</button><button class="mem"
        id="hMem" onclick="openMembers()"></button><span style="flex:1"></span>
      <div class="thm" id="thmH"></div><button class="btn sec sm" id="hMe" onclick="openProfile()"></button><button
        class="btn danger sm" onclick="leave()"><i data-lucide="log-out"></i>退室</button>
    </header>
    <nav id="nav" aria-label="画面の切り替え"></nav>
    <div class="main">
      <section class="pane" id="pane"></section>
      <aside>
        <div class="card" id="side"></div>
      </aside>
    </div>
  </div>
  <dialog id="dlg" aria-labelledby="dt">
    <div id="dc"></div>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>

</html>
